# Compose de despliegue en EC2: usa las imágenes ya publicadas en GHCR
# (no compila nada). La variable GHCR_OWNER se lee del archivo .env.
services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/backend-movies:latest
    environment:
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      DB_PATH: /data/movies.db
      STATIC_DIR: /data/static
    volumes:
      - movies-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER}/frontend-movies:latest
    environment:
      API_URL: http://backend:8000
    expose:
      - "4321"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  movies-data:
