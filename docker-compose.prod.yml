# Compose de despliegue en EC2: usa las imágenes ya publicadas en GHCR
# (no compila nada). Caddy se encarga del HTTPS automático (Let's Encrypt).
# Las variables GHCR_OWNER y DOMAIN se leen del archivo .env.
services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/backend-movies:latest
    environment:
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      DB_PATH: /data/movies.db
      STATIC_DIR: /data/static
    volumes:
      - movies-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER}/frontend-movies:latest
    environment:
      API_URL: http://backend:8000
    expose:
      - "4321"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  movies-data:
  caddy-data:
  caddy-config:
